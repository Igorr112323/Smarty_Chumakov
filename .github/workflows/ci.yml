name: ci

# Непрерывная проверка качества: тесты на трёх версиях Python и двух системах,
# линтер и форматирование, порог покрытия, воспроизводимость обучения и пилот на
# реальной русскоязычной модели (CPU).
#
# Запускается на каждый push и pull request; вручную — через Run workflow.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: Линтер, форматирование, покрытие
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spanverify-module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanverify-module/requirements.txt

      - name: Зависимости проверки
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff black

      - name: Линтер (ruff)
        run: python -m ruff check .

      - name: Форматирование (black --check)
        run: python -m black --check .

      - name: Тесты с порогом покрытия 85 %
        run: python -m pytest --cov=spanverify --cov-report=term --cov-fail-under=85

      - name: Воспроизводимость обучения (один seed → один результат)
        run: |
          python -m spanverify train --dataset data/demo_pairs.jsonl --out /tmp/run1/weights.json --seed 42 --folds 5 > /tmp/train1.log
          python -m spanverify train --dataset data/demo_pairs.jsonl --out /tmp/run2/weights.json --seed 42 --folds 5 > /tmp/train2.log
          sha256sum /tmp/run1/weights.json /tmp/run2/weights.json
          test "$(sha256sum < /tmp/run1/weights.json | cut -d' ' -f1)" = "$(sha256sum < /tmp/run2/weights.json | cut -d' ' -f1)"
          echo "Обучение воспроизводимо при одинаковом seed"

      - name: Метрики на отложенной части (числа в лог)
        run: python -m spanverify evaluate --dataset data/demo_pairs.jsonl

      - name: Сохранить отчёт обучения
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: |
            /tmp/train1.log
            /tmp/run1/weights.json
          retention-days: 30

  tests:
    name: Тесты (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: spanverify-module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: spanverify-module/requirements.txt

      - name: Зависимости тестов
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Тесты
        run: python -m pytest -q

      - name: Само-проверка конвейера
        run: python -m spanverify selftest

      - name: Проверка HTTP-контракта (реальный запрос к сервису)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "-m","spanverify","server","--host","127.0.0.1","--port","8765","--no-browser","--quiet" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 700
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 3
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "сервис не поднялся" }
            $payload = @{
              answer  = "Срок хранения первичных документов составляет 3 года."
              context = "Регламент 343: срок хранения первичных документов составляет 10 лет."
            } | ConvertTo-Json -Compress
            $body = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $result = Invoke-RestMethod -Uri "http://127.0.0.1:8765/v1/verify" -Method Post -Body $body -ContentType "application/json; charset=utf-8" -TimeoutSec 60
            Write-Host ("verdict={0} score={1} spans={2}" -f $result.verdict, $result.score, $result.spans.Count)
            if ($result.spans.Count -lt 1) { throw "подмена числа не найдена" }
            if ($result.spans[0].label -notin @("doubtful","likely_hallucination")) { throw "неверная метка фрагмента" }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

  pilot:
    name: Пилот на реальной модели (rugpt3small, CPU)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: spanverify-module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanverify-module/requirements-hf.txt

      - name: Кэш весов модели
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-rugpt3small-v1

      - name: Зависимости режима hf (torch CPU + transformers)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers sentencepiece

      - name: "Пилот: AUC признаков по слоям внимания"
        run: python scripts/pilot_rugpt3small.py --pairs 24 --bootstrap 5000 --out reports/pilot

      - name: Показать отчёт
        run: cat reports/pilot/pilot.md

      - name: Артефакт пилота
        uses: actions/upload-artifact@v4
        with:
          name: pilot-report
          path: |
            spanverify-module/reports/pilot/pilot.md
            spanverify-module/reports/pilot/pilot.json
          retention-days: 90
