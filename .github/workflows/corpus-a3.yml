name: corpus-a3

# Сборка корпуса A3 на реальных официально опубликованных актах.
#
# Почему так устроено
# -------------------
#
# 1. Среда разработки проекта в интернет не выпускается (reports/SOURCES_AVAILABILITY.json:
#    23 источника из 23 отвечают SSLZeroReturnError), поэтому загрузка выполняется на
#    раннере GitHub, а тексты и манифест возвращаются в ветку коммитом.
# 2. Официальные PDF публикации — сканы без пригодного текстового слоя (замер:
#    текстовый слой даёт 1–39 знаков на документ при 2–40 страницах), поэтому нужен OCR.
#    Первый прогон показал фактическую цену распознавания: 580–2680 секунд на документ.
#    Последовательная загрузка 120 документов в такую скорость не укладывается.
# 3. Отсюда два решения: загрузка разрезана на независимые срезы (по видам актов и по
#    региональным разделам) и идёт параллельно, а распознавание настроено на скорость
#    (--oem 1 --psm 6, OMP_THREAD_LIMIT=1, 150 dpi вместо 200).
#
# Запуск: изменить .github/corpus-a3.trigger и запушить (ручной Run workflow доступен
# только для рабочих процессов из ветки по умолчанию).

on:
  push:
    paths:
      - ".github/corpus-a3.trigger"
  workflow_dispatch:
    inputs:
      docs_per_shard:
        description: "Сколько документов набирать в каждом срезе"
        required: false
        default: "10"
      fetch_timeout_minutes:
        description: "Предел времени на шаг загрузки, минут"
        required: false
        default: "70"

permissions:
  contents: write

concurrency:
  group: corpus-a3-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  DOCS_PER_SHARD: ${{ inputs.docs_per_shard || '10' }}
  FETCH_TIMEOUT: ${{ inputs.fetch_timeout_minutes || '70' }}

jobs:
  # Замер скорости распознавания на настоящем файле: нужен и для выбора настроек,
  # и как измеренное число для отчёта о функциональном тестировании.
  bench:
    name: "Замер OCR на реальном PDF"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spanverify-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Зависимости и OCR
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install --disable-pip-version-check --quiet "pypdf~=6.1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus
      - name: Версии инструментов
        run: |
          nproc
          tesseract --version 2>&1 | head -2
          pdftoppm -v 2>&1 | head -1
      - name: Замер настроек распознавания
        run: python scripts/bench_ocr.py --out reports/OCR_BENCH.json --pages 2
      - name: Показать замер
        if: always()
        run: cat reports/OCR_BENCH.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-bench
          path: spanverify-module/reports/OCR_BENCH.json
          retention-days: 90

      # Замер коммитится: артефакты GitHub не читаются из среды разработки, а число
      # нужно реестру работ (пункт P2-2) и отчёту о функциональном тестировании.
      - name: Закоммитить замер
        if: always()
        run: |
          git config user.name "spanverify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/OCR_BENCH.json || true
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "замер скорости распознавания сканов [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "замер закоммичен (попытка $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=замер::не удалось закоммитить за 3 попытки"
          exit 0

  harvest:
    name: "Срез ${{ matrix.slice.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        slice:
          # Федеральные и ведомственные акты — только ветка по видам актов.
          - { name: "fz", types: "Федеральный закон", blocks: "none", share: "0.0" }
          - { name: "ukaz", types: "Указ", blocks: "none", share: "0.0" }
          - { name: "postanovlenie", types: "Постановление", blocks: "none", share: "0.0" }
          - { name: "prikaz", types: "Приказ", blocks: "none", share: "0.0" }
          - { name: "polozhenie", types: "Положение", blocks: "none", share: "0.0" }
          - { name: "rasporyazhenie", types: "Распоряжение", blocks: "none", share: "0.0" }
          # Региональные акты — только ветка по разделам субъектов. Приоритет задания:
          # Краснодарский край, Москва, Московская область, Санкт-Петербург, Ростовская
          # область, Ставропольский край, Татарстан, Свердловская область. Остальные
          # субъекты добраны, чтобы выйти на требуемые 40 региональных актов.
          - { name: "region23-krasnodar", types: "none", blocks: "23", share: "1.0" }
          - { name: "region50-mo", types: "none", blocks: "50", share: "1.0" }
          - { name: "region78-spb", types: "none", blocks: "78", share: "1.0" }
          - { name: "region61-rostov", types: "none", blocks: "61", share: "1.0" }
          - { name: "region26-stavropol", types: "none", blocks: "26", share: "1.0" }
          - { name: "region16-tatarstan", types: "none", blocks: "16", share: "1.0" }
          - { name: "region66-sverdlovsk", types: "none", blocks: "66", share: "1.0" }
          - { name: "region77-moskva", types: "none", blocks: "77", share: "1.0" }
          - { name: "region02-bashkortostan", types: "none", blocks: "02", share: "1.0" }
          - { name: "region24-krasnoyarsk", types: "none", blocks: "24", share: "1.0" }
          - { name: "region36-voronezh", types: "none", blocks: "36", share: "1.0" }
          - { name: "region52-nizhny", types: "none", blocks: "52", share: "1.0" }
          - { name: "region54-novosibirsk", types: "none", blocks: "54", share: "1.0" }
          - { name: "region63-samara", types: "none", blocks: "63", share: "1.0" }
          - { name: "region74-chelyabinsk", types: "none", blocks: "74", share: "1.0" }
    defaults:
      run:
        working-directory: spanverify-module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanverify-module/requirements.txt

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet -r requirements.txt
          python -m pip install --disable-pip-version-check --quiet "pypdf~=6.1"

      - name: Поставить OCR (poppler + tesseract с русским)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus

      # Срез собирается в чистый каталог: уже имеющийся корпус в ветке сюда не
      # копируется, иначе срез решит, что цель достигнута, и ничего не скачает.
      # Предел времени стоит на шаге: если он исчерпан, шаг снимается, но
      # артефакт с уже распознанными документами всё равно выгружается.
      # Срез начинает с уже собранного корпуса ветки: загрузчик видит эти документы
      # как скачанные и добирает только новые. Без этого каждый срез заново тянет
      # начало той же ленты — в прогоне 2 так получилось 23 дубликата из 73 документов.
      - name: Взять за основу уже собранный корпус
        run: |
          mkdir -p shard
          if [ -d data/corpus_a3/sources ]; then
            cp -r data/corpus_a3/sources shard/sources
            echo "взято за основу документов: $(ls shard/sources/*.txt 2>/dev/null | wc -l)"
          else
            echo "корпуса в ветке нет — срез начинает с нуля"
          fi

      - name: Загрузка среза (robots.txt, пауза ≥1 с, SHA256, прогресс на диск)
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(inputs.fetch_timeout_minutes || '70') }}
        run: |
          python scripts/fetch_npa_corpus.py \
            --out "shard" \
            --target-docs "$(( $(ls shard/sources/*.txt 2>/dev/null | wc -l) + DOCS_PER_SHARD ))" \
            --max-pages-per-type 6 \
            --max-pages-per-block 6 \
            --only-types "${{ matrix.slice.types }}" \
            --only-blocks "${{ matrix.slice.blocks }}" \
            --regional-share "${{ matrix.slice.share }}" \
            --buffer 6 \
            --pause 1.1 \
            --max-pages 6 \
            --dpi 150 \
            --all-themes \
            --workers 4 \
            --flush-every 1

      - name: Что собрано в срезе
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("shard/sources/sources.json")
          if not path.exists():
              print("::warning title=срез::sources.json не создан")
              raise SystemExit(0)
          documents = (json.loads(path.read_text(encoding="utf-8")).get("documents") or {})
          chars = sum(int(item.get("text_chars") or 0) for item in documents.values())
          facts = sum(int(item.get("facts_found") or 0) for item in documents.values())
          seconds = [item.get("ocr_seconds") for item in documents.values() if item.get("ocr_seconds")]
          print(f"документов: {len(documents)}; знаков: {chars}; фактов: {facts}")
          if seconds:
              print(f"OCR секунд на документ: мин {min(seconds)}, макс {max(seconds)}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-shard-${{ matrix.slice.name }}
          path: spanverify-module/shard
          retention-days: 30
          if-no-files-found: warn

  merge:
    name: "Слияние срезов, сборка пар и коммит"
    runs-on: ubuntu-latest
    needs: harvest
    if: always()
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spanverify-module
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanverify-module/requirements.txt

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/shards
          pattern: corpus-shard-*

      - name: Что скачано
        run: ls -R /tmp/shards | head -40

      # Слияние накопительное: документы, уже лежащие в ветке, сохраняются.
      - name: Слить срезы в корпус
        run: python scripts/merge_corpus_shards.py --shards /tmp/shards/* --out data/corpus_a3

      - name: Проверка хешей источников
        continue-on-error: true
        run: python scripts/fetch_npa_corpus.py --out data/corpus_a3 --verify

      - name: Сборка корпуса A3 (пары на реальных фрагментах)
        continue-on-error: true
        run: python scripts/build_corpus_a.py --docs data/corpus_a3/sources --out data/corpus_a3 --target 1200 --seed 43 --real

      - name: Проверки корпуса A3
        continue-on-error: true
        run: python -m pytest tests/test_corpus_a3.py -q

      - name: Отчёт по корпусу A3
        continue-on-error: true
        run: python scripts/make_corpus_a3_report.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-a3
          path: |
            spanverify-module/data/corpus_a3
            spanverify-module/reports/CORPUS_A3.md
          retention-days: 90

      - name: Закоммитить корпус в ветку
        if: always()
        run: |
          git config user.name "spanverify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/corpus_a3 reports/CORPUS_A3.md reports/CORPUS_REPORT.md || true
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "корпус A3: реальные акты, тексты и манифест [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "корпус закоммичен (попытка $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=A3::не удалось закоммитить корпус за 3 попытки"
          exit 0
