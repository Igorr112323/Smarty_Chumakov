# REALGEN-R1 фаза B: батарея E0/E1/R2 + fine-tune rubert-tiny2 на dev REALGEN.
# Запускается отдельным файлом-триггером ПОСЛЕ полной заморозки фазы A в git.
# Workflow не коммитит результаты: они идут в check-runs output.text.
name: REALGEN-R1 phase B measurement

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - .github/realgen-r1-b.trigger

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: realgen-r1-b-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  HF_HUB_DISABLE_TELEMETRY: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"
  HEAD_SHA: ${{ github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  measure:
    name: "REALGEN-B: признаки + rubert-tiny2 OOF"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости CPU (torch, transformers, sklearn)
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==5.20.1' 'numpy==2.4.6' 'scipy' 'scikit-learn' 'sentencepiece==0.2.2' huggingface_hub
          python -c "import torch, transformers, sklearn, scipy; print('torch', torch.__version__, 'transformers', transformers.__version__, 'sklearn', sklearn.__version__)"

      - name: Проверка заморозки фазы A (только dev, test_realgen не читаем)
        run: |
          python - <<'PY'
          import json, pathlib
          real = pathlib.Path('reports/science/real')
          f = json.loads((real/'REALGEN_FROZEN.json').read_text())
          assert f['n_answers'] >= 400
          assert f['splits']['dev']['n_answers'] == 300
          assert f['splits']['test_realgen']['sealed'] is True
          assert f['real_test_viewed'] is False
          for line in (real/'REALGEN_ANSWERS_DEV.jsonl').open(encoding='utf-8'):
              rec = json.loads(line)
              assert rec['split'] == 'dev'
          print('phase A freeze OK; dev only')
          PY

      - name: Батарея признаков и OOF (bootstrap 5000)
        timeout-minutes: 38
        run: |
          set +e
          LIMIT=$(grep -o 'limit=[0-9]*' .github/realgen-r1-b.trigger 2>/dev/null | head -n1 | cut -d= -f2)
          echo "phase-b limit=${LIMIT:-0} (0 = полный dev 300)"
          python -u reports/science/real/realgen_phase_b.py --publish --bootstrap 5000 --limit "${LIMIT:-0}" --out-dir .arena/realgen_b 2>&1 | tee /tmp/pb.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            tail -c 8000 /tmp/pb.log > /tmp/pb_tail.txt
            python - <<'PY'
          import json, os
          text = open('/tmp/pb_tail.txt', encoding='utf-8', errors='replace').read()
          payload = {
              "name": "REALGEN-B/diagnostics",
              "head_sha": os.environ['HEAD_SHA'],
              "status": "completed",
              "conclusion": "failure",
              "output": {"title": "REALGEN-B failure tail", "summary": "Дословный хвост лога (check-runs bridge)", "text": text},
          }
          open('/tmp/pb_payload.json', 'w', encoding='utf-8').write(json.dumps(payload, ensure_ascii=False))
          PY
            gh api --method POST "repos/${{ github.repository }}/check-runs" --input /tmp/pb_payload.json || true
            exit $RC
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realgen-b
          path: .arena/realgen_b/
          retention-days: 14
          if-no-files-found: warn
