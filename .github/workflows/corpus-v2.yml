# Корпус v2: независимая выборка для цикла v2.
#
# Зачем отдельный workflow. Цикл v1 использовал все документы, которые лежат в
# репозитории: 409 актов в `data/corpus_a3/sources`, их подмножество в
# `data/corpus_a3_local70`, 60 синтетических документов A1 и демо. Проверено
# побайтово: новых документов внутри репозитория нет (пересечение local70 с A3 —
# 20 из 20). Поэтому v2 обязан быть скачан заново, и он обязан не содержать ни
# одного doc_id из v1 — иначе «независимая тестовая выборка» была бы подглядыванием
# в уже измеренное (проверка — в job «Сборка волны», `overlap` обязан быть 0).
#
# Почему волны на паузе. Изначальный режим заказа — `--text-only` (брать только PDF со
# встроенным текстовым слоем). Измеренная урожайность этого режима: волна `38112679499`
# (2026-10-11, 15 срезов) дала 8 файлов-кандидатов и 4 новых документа за 13м00с; доля
# актов источника с годным слоем — 4/272 = 0,0147, 95 % ДИ [0,0057; 0,0372]
# (`python3 scripts/text_layer_yield.py --sources data/corpus_a3/sources/sources.json --all`).
# Исполнитель перешёл на распознавание без подтверждения заказчика — это отступление от
# решения заказчика, поэтому режим вынесен в явный переключатель `.github/corpus-v2.mode`
# (`text-only` | `ocr` | `paused`) и job `gate` не даёт волнам идти, пока выбор не подтверждён.
# Уже скачанное не удаляется: помечается `ocr_pending_approval` (см. `reports/v2/corpus_status.json`).
#
# Волны идут цепочкой: job `chain` запускает следующую, пока в ветке данных меньше
# `target_docs` и пока предыдущая волна добавила хоть что-то. Так сборка не требует
# человека между прогонами и не может зациклиться на пустом результате.
#
# Запуск вручную: правкой файла .github/corpus-v2.trigger («Run workflow» для
# ветки не из ветки по умолчанию недоступен) либо workflow_dispatch.
name: "Корпус v2 (независимая выборка)"

on:
  workflow_dispatch:
    inputs:
      target_per_slice:
        description: "Сколько документов с текстом собрать в одном срезе за волну"
        type: string
        default: "12"
      page_from:
        description: "С какой страницы выдачи начинать (увод от срезов v1 и от прошлых волн)"
        type: string
        default: "3"
      target_docs:
        description: "Сколько всего документов нужно в ветке данных, чтобы остановить цепочку"
        type: string
        default: "1800"
  push:
    branches: ["arena/**", "data/corpus-v2-wave"]
    paths:
      - .github/corpus-v2.trigger
      # Каждый коммит в ветку-счётчик — это ровно одна запрошенная волна: механизм
      # цепочки вместо `workflow_dispatch` (прогон 38113258526 показал, что у
      # GITHUB_TOKEN этого репозитория нет права actions:write: dispatch → 403).
      - "wave/**"

concurrency:
  # Группа одна на все ветки: две волны не должны одновременно писать в один кэш
  # среза и в одну ветку данных.
  group: corpus-v2
  # Волны идут последовательно и не отменяют друг друга: кэш среза продолжает
  # начатое, а отмена прогона посреди волны означала бы потерю распознанного.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: "Режим загрузки (решение заказчика)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      run: ${{ steps.mode.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: "Прочитать .github/corpus-v2.mode"
        id: mode
        run: |
          file=.github/corpus-v2.mode
          if [ ! -f "$file" ]; then
            mode=paused
          else
            mode=$(tr -d '\r' < "$file" | head -1 | tr -d '[:space:]')
          fi
          case "$mode" in
            text-only) run=yes ;;
            ocr)
              # распознавание включается только при отметке решения заказчика в этом же файле:
              # `ocr approved YYYY-MM-DD <кем>` — иначе это самовольная смена режима
              if grep -Eqi '\bapproved\b[[:space:]]+[0-9]{4}-[0-9]{2}-[0-9]{2}' "$file"; then
                run=yes
              else
                echo "::warning::[corpus-v2] режим ocr без отметки «approved YYYY-MM-DD» — волна не идёт" >&2
                run=no
                mode=paused
              fi ;;
            paused|"") run=no ;;
            *) echo "::error::[corpus-v2] .github/corpus-v2.mode = «$mode»: допустимо text-only, ocr или paused" >&2; run=no; mode=paused ;;
          esac
          {
            echo "## Режим загрузки корпуса v2"
            echo
            echo "* режим из \`.github/corpus-v2.mode\`: \`$mode\`"
            echo "* волны запускаются: \`$run\`"
            echo
            echo "OCR-волны включаются только после явного подтверждения заказчика (правка"
            echo "\`.github/corpus-v2.mode\` на \`ocr\` коммитом в рабочую ветку). \`paused\` —"
            echo "ожидание решения; \`text-only\` — режим, выбранный заказчиком изначально."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  slice:
    name: "Срез «${{ matrix.title }}»"
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    # 40 минут — общий потолок этого репозитория для job'ов (тест
    # test_no_job_is_longer_than_the_limit); длинная работа прерывается на границе
    # волны и продолжается с кэша, а не висит часами.
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- вид акта: федеральный и ведомственный уровень ---
          - slice: fz
            title: Федеральный закон
            types: "Федеральный закон"
          - slice: ukaz
            title: Указ
            types: "Указ"
          - slice: postanov
            title: Постановление
            types: "Постановление"
          - slice: prikaz
            title: Приказ
            types: "Приказ"
          - slice: polozhenie
            title: Положение
            types: "Положение"
          - slice: rasporyazh
            title: Распоряжение
            types: "Распоряжение"
          # --- региональный уровень: срез по названию акта ---
          - slice: dfo
            title: Акты субъектов (общий срез)
            types: ""
            title_filter: "правительств|министерств|ведомств"
          - slice: krasnodar2
            title: Краснодарский край (срез 2)
            types: ""
            title_filter: "краснодарск"
          - slice: moskva2
            title: Москва (срез 2)
            types: ""
            title_filter: "москв"
          - slice: spb2
            title: Санкт-Петербург (срез 2)
            types: ""
            title_filter: "санкт-петербург|петербург"
          - slice: ekos
            title: Экология и природопользование
            types: ""
            title_filter: "эколог|природопольз|отход"
          - slice: sport
            title: Спорт и молодёжная политика
            types: ""
            title_filter: "спорт|молодёж|молодеж"
          - slice: kult
            title: Культура и архивы
            types: ""
            title_filter: "культур|архив|библиотек"
          - slice: it
            title: ИТ, связь и документооборот
            types: ""
            title_filter: "информацион|связи|электрон"
          - slice: finance
            title: Финансы, закупки и имущество
            types: ""
            title_filter: "бюджет|закупк|имуществ"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Зависимости (tesseract нужен только в режиме ocr)"
        working-directory: spanverify-module
        timeout-minutes: 8
        run: |
          if [ "${{ needs.gate.outputs.mode }}" = "ocr" ]; then
            sudo apt-get update -o Acquire::Retries=5 || true
            sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus poppler-utils || \
              echo "tesseract не установился — распознавание будет недоступно"
            tesseract --version | head -2 || true
          else
            echo "режим ${{ needs.gate.outputs.mode }}: tesseract не устанавливаем"
          fi
          python -m pip install --upgrade pip
          python -m pip install -q pypdf requests

      - name: Список уже собранных doc_id (ветка данных) — чтобы не распознавать повторно
        id: archived
        timeout-minutes: 3
        run: |
          n_total=0
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/trees/data/corpus-v2-raw?recursive=1" \
            > /tmp/tree.json || echo '{}' > /tmp/tree.json
          jq -r '.tree[]? | select(.path | startswith("acts/")) | .path' /tmp/tree.json \
            | sed 's|^acts/||; s|\.txt$||' | sort -u > /tmp/archived.txt
          n_total=$(wc -l < /tmp/archived.txt)
          waves=$(jq -r '.tree[]? | select(.path | startswith("reports-wave-"))' /tmp/tree.json | wc -l)
          # Срез выдачи уезжает вперёд на номер волны: без этого вторая волна
          # перебирала бы те же страницы выдачи и получала «0 новых документов».
          page_from=$((3 + waves))
          if [ -n "${{ inputs.page_from }}" ]; then page_from="${{ inputs.page_from }}"; fi
          echo "в ветке данных документов: $n_total, волн: $waves, page_from: $page_from"
          echo "docs=$n_total" >> "$GITHUB_STEP_SUMMARY"
          echo "waves=$waves" >> "$GITHUB_OUTPUT"
          echo "page_from=$page_from" >> "$GITHUB_OUTPUT"

      - name: Кэш среза (что уже скачано и распознано в прошлых волнах)
        uses: actions/cache@v4
        with:
          path: spanverify-module/data/corpus_v2_slice_${{ matrix.slice }}
          key: corpus-v2-${{ matrix.slice }}-wave${{ steps.archived.outputs.waves || '0' }}
          restore-keys: |
            corpus-v2-${{ matrix.slice }}-

      - name: Загрузка и распознавание среза
        # `--force` обязателен для цепочки волн: кэш среза продолжает начатое, и без
        # него «достаточно документов» считается по накопленному в кэше — вторая волна
        # в том же срезе не скачала бы ни одного документа (проверено на прогоне
        # 38114525626: +0 документов, цепочка корректно остановилась по нулевому
        # прогрессу). Отбор при этом всё равно пропускает уже известные doc_id.
        working-directory: spanverify-module
        timeout-minutes: 38
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          set -o pipefail
          diag="$RUNNER_TEMP/corpus-v2-diag.log"; : > "$diag"
          trap 'sync; sleep 6; tail -c 4000 "$diag" | sed -e "s/[[:cntrl:]]/ /g" -e "s/%/%25/g" -e "s|^|::error::[corpus-v2 ${{ matrix.slice }}] |"; tail -n 40 "$diag" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          exec > >(tee -a "$diag") 2>&1
          python scripts/fetch_npa_corpus.py \
            --out data/corpus_v2_slice_${{ matrix.slice }} \
            --target-docs ${{ inputs.target_per_slice || '12' }} \
            --buffer 12 \
            --types "${{ matrix.types }}" \
            --title-filter "${{ matrix.title_filter }}" \
            --page-from ${{ steps.archived.outputs.page_from || '3' }} \
            --max-pages-per-type 30 --max-pages 20 --dpi 200 \
            --workers 4 --pause 1.2 \
            --exclude-dirs "data/corpus_a3;data/corpus_a3_local70" \
            --exclude-file /tmp/archived.txt \
            ${{ needs.gate.outputs.mode == 'text-only' && '--text-only' || '' }} \
            --force

      - name: Сколько получилось в срезе
        id: count
        working-directory: spanverify-module
        timeout-minutes: 3
        run: |
          d=data/corpus_v2_slice_${{ matrix.slice }}/sources
          n=$(ls -1 "$d"/*.txt 2>/dev/null | wc -l)
          ocr=$(grep -l '"method": "ocr' "$d"/sources.json 2>/dev/null | wc -l)
          echo "срез ${{ matrix.slice }}: документов с текстом: $n (источников с распознаванием в sources.json: $ocr)"
          echo "документов: $n" >> "$GITHUB_STEP_SUMMARY"
          echo "docs=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          # Число документов — прямо в имени артефакта: содержимое артефакта и логи
          # job'а снаружи не читаются, а имена видны через API.
          name: corpus-v2-${{ matrix.slice }}-документов-${{ steps.count.outputs.docs }}
          path: spanverify-module/data/corpus_v2_slice_${{ matrix.slice }}
          if-no-files-found: warn
          retention-days: 90

  assemble:
    name: "Сборка волны и сверка с v1"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.gate.outputs.run == 'yes'
    needs: [slice, gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: wave
          pattern: corpus-v2-*

      - name: Свести срезы и проверить независимость от v1
        id: merge
        timeout-minutes: 8
        run: |
          set -o pipefail
          mkdir -p /tmp/wave_all/sources
          find wave -path '*/sources/*.txt' -exec cp -n {} /tmp/wave_all/sources/ \;
          find wave -name 'sources.json' -exec cp -n {} /tmp/wave_all/ \; || true
          total=$(ls -1 /tmp/wave_all/sources/*.txt 2>/dev/null | wc -l)
          ls -1 spanverify-module/data/corpus_a3/sources/*.txt 2>/dev/null | xargs -r -n1 basename | sed 's/\.txt$//' | sort -u > /tmp/v1_ids.txt
          ls -1 spanverify-module/data/corpus_a3_local70/sources/*.txt 2>/dev/null | xargs -r -n1 basename | sed 's/\.txt$//' | sort -u >> /tmp/v1_ids.txt
          sort -u /tmp/v1_ids.txt -o /tmp/v1_ids.txt
          used=$(wc -l < /tmp/v1_ids.txt)
          ls -1 /tmp/wave_all/sources/*.txt 2>/dev/null | xargs -r -n1 basename | sed 's/\.txt$//' | sort -u > /tmp/v2_ids.txt
          new_ids=$(wc -l < /tmp/v2_ids.txt)
          overlap=$(comm -12 /tmp/v1_ids.txt /tmp/v2_ids.txt | wc -l)
          echo "документов в волне: $total (уникальных id: $new_ids), id в списках v1: $used, пересечение: $overlap"
          {
            echo "## Волна корпуса v2"
            echo
            echo "| метрика | значение |"
            echo "|---|---|"
            echo "| документов в волне | $total |"
            echo "| уникальных doc_id | $new_ids |"
            echo "| doc_id в списках v1 (A3 + local70) | $used |"
            echo "| **пересечение v2 ∩ v1** | **$overlap** |"
            echo
            echo "| срез | документов |"
            echo "|---|---|"
            for d in wave/*/; do
              [ -d "$d" ] || continue
              echo "| $(basename "$d") | $(find "$d" -path '*/sources/*.txt' | wc -l) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "docs=$total" >> "$GITHUB_OUTPUT"
          if [ "$overlap" != "0" ]; then
            echo "::error::[corpus-v2] независимость нарушена: $overlap документов уже есть в корпусах v1"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-v2-wave
          path: /tmp/wave_all
          if-no-files-found: warn
          retention-days: 90

  archive:
    name: "Архив волны в ветку данных"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.gate.outputs.run == 'yes'
    needs: [assemble, gate]
    permissions:
      contents: write
    outputs:
      before: ${{ steps.push.outputs.before }}
      after: ${{ steps.push.outputs.after }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: corpus-v2-wave
          path: wave

      - name: Сложить тексты в ветку данных (ветку создаёт первая волна)
        id: push
        timeout-minutes: 12
        run: |
          set -o pipefail
          branch=data/corpus-v2-raw
          mkdir -p /tmp/dbr
          cd /tmp/dbr
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "spanverify-bot"
          git config user.email "bot@spanverify.local"
          if git ls-remote --exit-code origin "$branch" >/dev/null 2>&1; then
            git fetch -q origin "$branch"
            git checkout -q FETCH_HEAD
          else
            git checkout -q --orphan "$branch"
            {
              echo "# Ветка данных: тексты корпуса v2"
              echo
              echo "Сырьё цикла v2: официально опубликованные акты, тексты после извлечения."
              echo "Лицензионная основа — п. 6 ст. 1259 ГК РФ: официальные документы государственных"
              echo "органов не являются объектами авторских прав. В рабочую ветку тексты не коммитятся,"
              echo "чтобы не раздувать клон: в репозитории лежат пары, сплиты и манифесты со sha256."
            } > README.md
            git add README.md
            git commit -qm "корпус v2: ветка данных [skip ci]"
          fi
          before=$(ls -1 acts/*.txt 2>/dev/null | wc -l)
          mkdir -p acts
          # cp -n: накопление волн без перезаписи — sha256 уже архивированного документа
          # не может измениться второй волной, иначе хеши в манифесте разошлись бы.
          find "$GITHUB_WORKSPACE/wave" -path '*/sources/*.txt' -exec cp -n {} acts/ \; 2>/dev/null || true
          after=$(ls -1 acts/*.txt 2>/dev/null | wc -l)
          stamp=$(date -u +%Y%m%dT%H%M%S)
          {
            echo "# Волна корпуса v2 от $stamp"
            echo
            echo "* документов до волны: $before"
            echo "* документов после волны: $after"
            echo "* добавлено: $((after - before))"
            echo
            echo "Добавление идёт по «cp -n»: ветка данных — накапливаемый архив волн,"
            echo "а не слепок одного прогона. Цепочку волн останавливает job «Цепочка волн»."
          } > "reports-wave-$stamp.md"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$after" = "$before" ]; then
            echo "новых документов нет — отчёт волны не коммитится"
            exit 0
          fi
          git add -A acts "reports-wave-$stamp.md"
          git commit -qm "корпус v2: волна $stamp — $after документов [skip ci]"
          git push -q origin "HEAD:$branch"
          echo "документов в ветке данных: $before → $after" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chain:
    name: "Цепочка волн"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [archive, gate]
    if: always() && needs.gate.outputs.run == 'yes' && needs.archive.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Запросить следующую волну коммитом в ветку-счётчик
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ needs.archive.outputs.before }}
          AFTER: ${{ needs.archive.outputs.after }}
          TARGET: ${{ inputs.target_docs || '1800' }}
        run: |
          set -o pipefail
          before=${BEFORE:-0}; after=${AFTER:-0}; target=${TARGET:-1800}
          waves=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/trees/data/corpus-v2-raw?recursive=1" \
            | jq -r '.tree[]? | select(.path | startswith("reports-wave-"))' | wc -l)
          {
            echo "## Цепочка волн корпуса v2"
            echo
            echo "| величина | значение |"
            echo "|---|---|"
            echo "| документов до волны | $before |"
            echo "| после волны | $after |"
            echo "| цель | $target |"
            echo "| волн в ветке данных | $waves |"
          } >> "$GITHUB_STEP_SUMMARY"
          stop=""
          if [ "$after" -ge "$target" ]; then
            stop="цель по числу документов достигнута ($after из $target)"
          elif [ "$after" -le "$before" ]; then
            stop="волна не добавила документов: срез выдачи исчерпан или сломалось распознавание — цепочка остановлена, чтобы не жечь раннеры впустую"
          elif [ "$waves" -ge 24 ]; then
            stop="предохранитель цепочки (24 волны): документов $after — остановка, разбираемся с урожайностью срезов"
          fi
          if [ -n "$stop" ]; then
            echo "СТОП: $stop" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Механизм цепочки: коммит файла в отдельную ветку-счётчик. Она попала в
          # paths-фильтр этого workflow, и её push запускает следующую волну.
          # «[skip ci]» здесь невозможен именно потому, что он убил бы сам запуск.
          branch=data/corpus-v2-wave
          mkdir -p /tmp/counter && cd /tmp/counter
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "spanverify-bot"
          git config user.email "bot@spanverify.local"
          # База коммита-запроса — содержимое рабочей ветки, а не пустой orphan:
          # для push-события GitHub берёт файл workflow из отправленного коммита, и
          # если в нём нет `.github/workflows/corpus-v2.yml` и `spanverify-module/`,
          # следующая волна либо вообще не запустится, либо упадёт без скриптов.
          git fetch -q origin "${{ github.ref_name }}"
          git checkout -q FETCH_HEAD
          previous=""
          if git ls-remote --exit-code origin "$branch" >/dev/null 2>&1; then
            git fetch -q origin "$branch"
            previous=$(git show "FETCH_HEAD:wave/requests.md" 2>/dev/null || true)
          fi
          mkdir -p wave
          {
            if [ -n "$previous" ]; then
              printf '%s\n' "$previous"
            else
              echo "# Запросы волн корпуса v2"
              echo
              echo "Каждая строка — запрос следующей волны загрузки (коммит в эту ветку"
              echo "попадает в paths-фильтр workflow и запускает её). Правая колонка —"
              echo "число документов в ветке данных на момент запроса."
              echo
              echo "| волна | запрошена | документов после предыдущей |"
              echo "|---|---|---|"
            fi
            printf '| %s | %s | %s |\n' "$((waves + 1))" "$(date -u +%FT%TZ)" "$after"
          } > wave/requests.md
          git add wave/requests.md
          # Гигиена коммита в публичную ветку: только текстовые файлы-счётчики, без
          # бинарников и без токенов (URL с x-access-token живёт только в конфиге git,
          # в дерево он не попадает — проверяем это перед push, а не на глаз).
          staged=$(git diff --cached --name-only)
          for file in $staged; do
            case "$file" in
              wave/*.md) ;;
              *) echo "::error::[corpus-v2] в коммит цепочки попал лишний файл $file" >&2; exit 1 ;;
            esac
            size=$(wc -c < "$file")
            if [ "$size" -gt 20000 ]; then
              echo "::error::[corpus-v2] $file весит $size байт — счётчик волн обязан оставаться текстовым" >&2
              exit 1
            fi
          done
          if git diff --cached | grep -E 'gh[pousr]_[A-Za-z0-9]{20,}|x-access-token|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::[corpus-v2] в диффе цепочки похож на токен/ключ — коммит запрещён" >&2
            exit 1
          fi
          echo "коммит цепочки: $(echo "$staged" | tr '\n' ' ') — только текстовые счётчики" >> "$GITHUB_STEP_SUMMARY"
          git commit -qm "корпус v2: запрос волны $((waves + 1)) (документов $after из $target)"
          git push -f -q origin "HEAD:$branch"
          echo "запрошена волна $((waves + 1)): документов $after из $target" | tee -a "$GITHUB_STEP_SUMMARY"
