# Знак и информативность признаков сетки на валидации (A3 dev).
#
# Зачем отдельный прогон. В `docs/ПРИЗНАКИ.md` зафиксировано: пилот на 96 парах
# дал значимые отклонения AUC от 0,5, и все — ниже 0,5. Прежде чем писать
# «признак информативен», надо измерить знак на официальной валидации. Модель для
# этого не нужна: признаки уже лежат в кеше сетки (формат v3) тяжёлого прогона,
# поэтому job читает артефакт и считает AUC со стандартной библиотекой.
#
# Что выходит. `spanverify-module/reports/hf_protocol/feature_signs_a3dev.json` и
# `.md` коммитом в ту же ветку (паттерн hf-analysis.yml) + аннотации прогона,
# чтобы числа читались без скачивания артефакта. Тестовая часть не открывается:
# скрипт принимает только val и падает, если вместо него подставляют test.
#
# Запуск: workflow_dispatch (номер прогона с кешем — параметр) или пуш
# .github/hf-feature-signs.trigger в ветку arena/**.
name: Знак признаков на валидации (A3 dev)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Прогон «Тяжёлые прогоны hf», из которого брать кеш сетки A3"
        default: "37609202780"
  push:
    branches: ["arena/**"]
    paths:
      - .github/hf-feature-signs.trigger

concurrency:
  group: hf-feature-signs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUN_ID: ${{ github.event.inputs.run_id || '37609202780' }}

jobs:
  signs:
    name: "AUC и знак по каждому признаку сетки (val)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Зависимости (без torch: работает кеш и стандартная библиотека)"
        working-directory: spanverify-module
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt

      - name: "Кеш сетки из тяжёлого прогона"
        uses: actions/download-artifact@v4
        with:
          name: hf-runs-a3
          run-id: ${{ env.RUN_ID }}
          path: /tmp/signs-dl
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Разложить кеш и сообщить, что в нём"
        # Диагностика обязана быть в аннотациях: загрузка журналов сборки из этой среды
        # недоступна (blob.core.windows.net), а без неё прогон непонятно почему упавший
        # превращается в «не проверено». Шаг ничего не решает за скрипт измерения: он
        # раскладывает файлы и печатает факты о их форме.
        run: |
          python3 - << 'PY'
          import gzip
          import json
          import shutil
          from pathlib import Path

          def note(text):
              print(f"::notice title=диагностика кеша::{text}")

          downloaded = sorted(p for p in Path("/tmp/signs-dl").rglob("*") if p.is_file())
          grids = [p for p in downloaded if p.name.startswith(("grid_", "features_grid_"))]
          note(f"файлов в артефакте: {len(downloaded)}, из них кешей сетки: {len(grids)}")
          for path in grids[:6]:
              note(f"{path.relative_to('/tmp/signs-dl')} — {path.stat().st_size} Б")
          if not grids:
              for path in downloaded[:10]:
                  note(f"первый уровень артефакта: {path.relative_to('/tmp/signs-dl')}")
              raise SystemExit("в артефакте нет файлов grid_*.jsonl[.gz]: кеш не там, где ожидалось")

          dest = Path("spanverify-module/reports/hf-cache-a3")
          dest.mkdir(parents=True, exist_ok=True)
          # Кладём плоско и только кеш: вложенность каталога артефакта — типичная причина
          # «файл есть, а glob его не видит».
          for path in grids:
              shutil.copy2(path, dest / path.name)
          note(f"складываем в {dest}: {sorted(p.name for p in dest.iterdir())}")

          sample = grids[0]
          opener = gzip.open if sample.suffix == ".gz" else open
          with opener(sample, "rt", encoding="utf-8") as handle:
              first = json.loads(handle.readline())
          note(
              "первая строка кеша: keys="
              + ",".join(sorted(first.keys()))
              + f" grid_format={first.get('grid_format')} model={first.get('model')}"
          )
          cache = {}
          for path in grids:
              op = gzip.open if path.suffix == ".gz" else open
              with op(path, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      row = json.loads(line)
                      cache[str(row.get("pair_id") or row.get("key") or "")] = row
          note(f"уникальных pair_id в кеше: {len(cache)}")

          val = Path("spanverify-module/data/corpus_a3/splits/dev.jsonl")
          if not val.is_file():
              val = Path("spanverify-module/data/corpus_a3/splits/val.jsonl")
          if val.is_file():
              ids = []
              with open(val, "r", encoding="utf-8") as handle:
                  for line in handle:
                      line = line.strip()
                      if line:
                          ids.append(str(json.loads(line).get("id")))
              missing = [i for i in ids if i not in cache]
              note(f"файл валидации: {val.name}, пар {len(ids)}, нет в кеше: {len(missing)}")
              if missing:
                  note(f"пример отсутствующих id: {missing[:5]}")
          else:
              note("файл валидации не найден — скрипт измерения сообщит об этом сам")
          PY

      - name: "Измерить знак и AUC по каждому признаку (только val)"
        working-directory: spanverify-module
        timeout-minutes: 20
        run: |
          echo "команда: python3 scripts/feature_sign_check.py --grid-cache reports/hf-cache-a3 --splits data/corpus_a3/splits --bootstrap 5000 --seed 42 --annotate --out-json reports/hf_protocol/feature_signs_a3dev.json --out-md reports/hf_protocol/feature_signs_a3dev.md (кеш — прогон $RUN_ID)"
          set -o pipefail
          if python3 scripts/feature_sign_check.py \
            --grid-cache reports/hf-cache-a3 \
            --splits data/corpus_a3/splits \
            --bootstrap 5000 \
            --seed 42 \
            --annotate \
            --out-json reports/hf_protocol/feature_signs_a3dev.json \
            --out-md reports/hf_protocol/feature_signs_a3dev.md 2>&1 | tee /tmp/signs.log; then
            :
          else
            # Последние строки ошибки — в аннотации: журнал сборки отсюда не читается.
            tail -n 25 /tmp/signs.log | sed 's/^[[:space:]]*//' | while IFS= read -r line; do
              printf '::error title=сбой измерения::%s\n' "$line"
            done
            exit 1
          fi

      - name: "Таблица в лог (чтобы её видно было в аннотациях и в отчёте прогона)"
        if: always()
        working-directory: spanverify-module
        run: |
          if [ -f reports/hf_protocol/feature_signs_a3dev.md ]; then
            cat reports/hf_protocol/feature_signs_a3dev.md
          else
            echo "::error title=нет таблицы::файл feature_signs_a3dev.md не создан"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-signs-a3dev
          path: |
            spanverify-module/reports/hf_protocol/feature_signs_a3dev.json
            spanverify-module/reports/hf_protocol/feature_signs_a3dev.md
          if-no-files-found: warn
          retention-days: 90

      - name: "Коммит чисел в ветку"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- spanverify-module/reports/hf_protocol/feature_signs_a3dev.json spanverify-module/reports/hf_protocol/feature_signs_a3dev.md
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "числа: знак и AUC признаков на val (кеш прогона $RUN_ID) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "запушено в ${GITHUB_REF_NAME}"
