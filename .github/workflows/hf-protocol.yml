# Протокол измерения критерия режима hf (docs/METRIC_SPEC.md).
#
# Зачем отдельный workflow: критерий «F1 ≥ 0,60 при FPR ≤ 0,40 на отложенном по
# документам test» должен быть получен прогоном, а не заявлением. Дорогая часть —
# прямой проход по языковой модели (секунды на пару), и она выполняется один раз:
# job `grid` считает широкую сетку признаков (36 имён) для обучающей и
#_validation_ частей, job `sweep` поверх кеша перебирает не более 10 конфигураций,
# а шаг 3 (`final`) догружает признаки test и считает финал ровно один раз.
#
# Запуск: workflow_dispatch (шаг 2 — всегда; шаг 3 — только с run_final=true) или
# пуш файла .github/hf-protocol.trigger (номер замера в содержимом). Шаг 3 таким
# пушем запускается только если в сообщении коммита есть метка [hf-final]:
# dispatch требует права actions:write, которого у тожена песочницы нет, а шаг 3
# обязан выполняться ровно один раз и только после фиксации конфигурации.
#
# Почему test считается отдельным job'ом: признаки test физически не попадают в
# кеш шага 2, поэтому перебрать конфигурации на test невозможно даже случайно.
#
# Результаты: артефакты прогона + коммит в ветку данных data/metrics (всегда с
# [skip ci]); ci.yml в ветку не пишет ничего.
name: Протокол hf (критерий ТЗ)

on:
  workflow_dispatch:
    inputs:
      run_final:
        description: "Шаг 3: запустить финальную оценку на test (ровно один раз)"
        type: boolean
        default: false
      corpora:
        description: "Корпусы через запятую"
        default: "a3,a1"
      shards:
        description: "Число шардов предпосчёта признаков"
        default: "4"
  push:
    branches: ["arena/**"]
    paths:
      - .github/hf-protocol.trigger

concurrency:
  group: hf-protocol-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  HF_MODEL: ai-forever/rugpt3small_based_on_gpt2
  SEED: "42"

jobs:
  grid:
    name: "Сетка признаков train+dev, ${{ matrix.corpus }}, шард ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    # 60 минут: 1023 пары A3 при ~2,5 с/пару = ~43 минуты на весь корпус, делить
    # на число шардов; запас — на загрузку весов и установку torch.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        corpus: [a3, a1]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Кэш весов модели"
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-rugpt3small-v1
      - name: "Зависимости и среда"
        uses: ./.github/actions/hf-setup
      - name: "Сетка признаков обучающей и validation-частей"
        working-directory: spanverify-module
        env:
          OMP_NUM_THREADS: "4"
        run: |
          # Логи job'а из песочницы не читаются (result-хост не в списке разрешённых),
          # поэтому вывод шага пишется в файл, а при падении его последние строки
          # публикуются аннотацией: аннотации отдаёт Checks API, они доступны всегда.
          diag="$RUNNER_TEMP/hf-diag.log"; : > "$diag"
          trap 'sync; sleep 6; tail -c 4000 "$diag" | sed -e "s/[[:cntrl:]]/ /g" -e "s/%/%25/g" -e "s|^|::error::[grid ${{ matrix.corpus }} шард ${{ matrix.shard }}] |"; tail -n 60 "$diag" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          exec > >(tee -a "$diag") 2>&1
          corpus="${{ matrix.corpus }}"
          case "$corpus" in
            a3) dir="data/corpus_a3/splits" ;;
            a1) dir="data/corpus_a/splits" ;;
            *) echo "неизвестный корпус $corpus" >&2; exit 2 ;;
          esac
          splits="${corpus}-train=$dir/train.jsonl,${corpus}-dev=$dir/dev.jsonl"
          echo "python scripts/precompute_features.py --grid --model $HF_MODEL --dataset $dir/train.jsonl --split-files $splits --out reports/hf-grid --shard ${{ matrix.shard }} --shards ${{ matrix.shards || 4 }}"
          python scripts/precompute_features.py \
            --grid \
            --model "$HF_MODEL" \
            --dataset "$dir/train.jsonl" \
            --split-files "$splits" \
            --out reports/hf-grid \
            --shard "${{ matrix.shard }}" \
            --shards 4
      - name: "Проверка полноты кеша"
        working-directory: spanverify-module
        run: |
          python - << 'PY'
          import glob
          import json
          paths = sorted(glob.glob("reports/hf-grid/grid_*.jsonl"))
          assert paths, "шард не записал ни одного файла кеша"
          total = 0
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  rows = [json.loads(line) for line in handle if line.strip()]
              assert rows, f"{path}: пустой файл"
              for row in rows:
                  assert int(row.get("grid_format", 0)) == 3, (path, row.get("pair_id"))
                  assert len(row["arrays"]) == 36, (path, row.get("pair_id"), len(row["arrays"]))
                  assert len(row["tokens"]) == len(row["arrays"]["entropy_last"]), path
                  assert row["meta"]["unmatched_tokens"] == 0 or row["meta"]["seq_len"] >= row["meta"]["max_length"], (
                      f"{path}: {row['pair_id']} — токены ответа не сопоставлены с моделью без обрезки"
                  )
              total += len(rows)
              print(path, "строк", len(rows))
          print("всего строк кеша в этом шарде:", total)
          PY
      - name: "Product-кеш для базовой линии (val, формат v2)"
        working-directory: spanverify-module
        env:
          OMP_NUM_THREADS: "4"
        run: |
          # Логи job'а из песочницы не читаются (result-хост не в списке разрешённых),
          # поэтому вывод шага пишется в файл, а при падении его последние строки
          # публикуются аннотацией: аннотации отдаёт Checks API, они доступны всегда.
          diag="$RUNNER_TEMP/hf-diag.log"; : > "$diag"
          trap 'sync; sleep 6; tail -c 4000 "$diag" | sed -e "s/[[:cntrl:]]/ /g" -e "s/%/%25/g" -e "s|^|::error::[feat-cache ${{ matrix.corpus }} шард ${{ matrix.shard }}] |"; tail -n 60 "$diag" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          exec > >(tee -a "$diag") 2>&1
          corpus="${{ matrix.corpus }}"
          case "$corpus" in
            a3) dir="data/corpus_a3/splits" ;;
            a1) dir="data/corpus_a/splits" ;;
          esac
          # Шаг 1 обязан прогнать ТЕКУЩИЙ код, а не новую сетку: признаки для
          # него считаютсяproduct-путём (precompute без --grid) и только для
          # validation-части — test в этом шаге не участвует.
          python scripts/precompute_features.py \
            --dataset "$dir/dev.jsonl" \
            --mode hf --model "$HF_MODEL" \
            --shard "${{ matrix.shard }}" --shards 4 \
            --out "reports/hf-cache-val/$corpus"
      - uses: actions/upload-artifact@v4
        with:
          name: "grid-${{ matrix.corpus }}-${{ matrix.shard }}"
          path: spanverify-module/reports/hf-grid/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: "feat-${{ matrix.corpus }}-${{ matrix.shard }}"
          path: spanverify-module/reports/hf-cache-val/
          retention-days: 30
          if-no-files-found: error

  sweep:
    name: "Шаг 1–2: базовая линия и перебор конфигураций на val"
    needs: grid
    runs-on: ubuntu-latest
    # 150 минут: шаг 1 на кеше стоит минуты, а десять конфигураций на 46 607
    # обучающих строках (logreg до 800 эпох и бустинг до 60 раундов, ×2 корпуса)
    # — полтора часа. Больше нельзя: иначе job снимают по лимиту, и прогон
    # приходится начинать заново.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Зависимости и среда"
        uses: ./.github/actions/hf-setup
      - name: "Собрать кеш сетки со всех шардов"
        uses: actions/download-artifact@v4
        with:
          pattern: "grid-*"
          path: spanverify-module/reports/hf-grid
          merge-multiple: true
      - name: "Собрать product-кеш базовой линии"
        uses: actions/download-artifact@v4
        with:
          pattern: "feat-*"
          path: spanverify-module/reports/hf-cache-val
          merge-multiple: false
      - name: "Шаг 0: аудит разбиения (заодно проверяет, что артефакты на месте)"
        working-directory: spanverify-module
        run: |
          set -x
          python scripts/hf_protocol.py freeze \
            --corpus "a3=data/corpus_a3/splits;a1=data/corpus_a/splits" \
            --config config/hf_experiments.json \
            --out reports/hf_protocol
      - name: "Шаг 1: базовая линия текущего кода на val"
        working-directory: spanverify-module
        env:
          OMP_NUM_THREADS: "4"
        run: |
          # Логи job'а из песочницы не читаются (result-хост не в списке разрешённых),
          # поэтому вывод шага пишется в файл, а при падении его последние строки
          # публикуются аннотацией: аннотации отдаёт Checks API, они доступны всегда.
          diag="$RUNNER_TEMP/hf-diag.log"; : > "$diag"
          trap 'sync; sleep 6; tail -c 4000 "$diag" | sed -e "s/[[:cntrl:]]/ /g" -e "s/%/%25/g" -e "s|^|::error::[baseline] |"; tail -n 60 "$diag" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          exec > >(tee -a "$diag") 2>&1
          set -x
          python scripts/hf_protocol.py baseline \
            --corpus "a3=data/corpus_a3/splits;a1=data/corpus_a/splits" \
            --mode hf --model "$HF_MODEL" --seed "$SEED" \
            --features-cache reports/hf-cache-val \
            --out reports/hf_baseline
      - name: "Шаг 2: перебор не более 10 конфигураций на val"
        working-directory: spanverify-module
        run: |
          # Логи job'а из песочницы не читаются (result-хост не в списке разрешённых),
          # поэтому вывод шага пишется в файл, а при падении его последние строки
          # публикуются аннотацией: аннотации отдаёт Checks API, они доступны всегда.
          diag="$RUNNER_TEMP/hf-diag.log"; : > "$diag"
          trap 'sync; sleep 6; tail -c 4000 "$diag" | sed -e "s/[[:cntrl:]]/ /g" -e "s/%/%25/g" -e "s|^|::error::[sweep] |"; tail -n 60 "$diag" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          exec > >(tee -a "$diag") 2>&1
          set -x
          python scripts/hf_protocol.py sweep \
            --grid config/hf_experiments.json \
            --grid-cache reports/hf-grid \
            --corpus "a3=data/corpus_a3/splits;a1=data/corpus_a/splits" \
            --primary a3 \
            --out reports/hf_protocol \
            --write-predictions
          # Выбранные на val числа проверяются тем же пересчётом, что и финал:
          # расхождение «манифест vs предсказания» должно быть видно до шага 3.
          python scripts/hf_protocol.py verify-manifest \
            --manifest reports/hf_protocol/manifest_val.json \
            --predictions reports/hf_protocol/predictions_val.jsonl.gz
      - name: "Сводка для отчёта"
        working-directory: spanverify-module
        run: |
          python - << 'PY'
          import json
          data = json.loads(open("reports/hf_protocol/sweep.json", encoding="utf-8").read())
          primary = data.get("primary_corpus")


          def notice(text: str) -> None:
              # Логи job'а из песочницы не читаются (result-хост недоступен), а
              # числа шага 2 нужны дважды: для фиксации конфигурации ДО шага 3 и
              # для отчёта. Аннотации отдаёт Checks API — это второй канал, кроме
              # публикации в ветку данных, и он не зависит от git.
              safe = str(text).replace("\r", " ").replace("\n", " ").replace("%", "%25")
              print("::notice::[sweep] " + safe[:900])


          notice(
              f"лучшая конфигурация: {data.get('best')} | прогонов: {data.get('run_count')} | "
              f"правило: {data['rule']}"
          )
          # Одна аннотация на эксперимент:Annotations урезаются по количеству,
          # и построчный вывод по корпусу терял последние эксперименты.
          for item in data["experiments"]:
              parts = []
              for corpus, numbers in sorted(item["per_corpus"].items()):
                  tokens = numbers.get("tokens") or {}
                  mark = " [основной]" if corpus == primary else ""
                  parts.append(
                      f"{corpus}{mark}: F1(val) {tokens.get('f1')} FPR(val) {tokens.get('fpr')} "
                      f"AUC {tokens.get('auc')} порог {numbers.get('threshold')}"
                  )
              chosen = " → ВЫБРАНА" if item.get("name") == data.get("best") else ""
              notice(f"{item['number']:>2} {item['name']}: " + " | ".join(parts) + chosen)
          print("таблица шага 2 опубликована аннотациями")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: "hf-protocol-sweep"
          path: |
            spanverify-module/reports/hf_protocol/
            spanverify-module/reports/hf_baseline/
          retention-days: 90
          if-no-files-found: error
      - name: "Опубликовать в ветку данных"
        # Contents API вместо `git checkout -B`: прогон 38043189316 потерял числа
        # именно здесь — переключение рабочего дерева CI на другую ветку падает на
        # совпадении путей и на гонке двух job'ов, а артефакты читаются с хоста,
        # недоступного проверяющему. Публикация файлов по одному запросу этого не
        # требует, а повтор при 409 разрешает гонку.
        working-directory: spanverify-module
        env:
          # `gh` берёт токен и из GITHUB_TOKEN, но явное GH_TOKEN исключает
          # ситуации, когда на раннере уже лежит другой профиль аутентификации.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/publish_reports.py --branch data/metrics --dest hf-protocol \
            --report reports/hf_protocol \
            --message "hf протокол: шаг 0-2, прогон ${{ github.run_number }} [skip ci]"
          python scripts/publish_reports.py --branch data/metrics --dest hf-baseline \
            --report reports/hf_baseline \
            --message "hf протокол: базовая линия, прогон ${{ github.run_number }} [skip ci]"

  grid-test:
    name: "Сетка признаков test, ${{ matrix.corpus }}, шард ${{ matrix.shard }}"
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_final) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[hf-final]')) }}
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        corpus: [a3, a1]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Кэш весов модели"
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-rugpt3small-v1
      - name: "Зависимости и среда"
        uses: ./.github/actions/hf-setup
      - name: "Сетка признаков отложенной части"
        working-directory: spanverify-module
        env:
          OMP_NUM_THREADS: "4"
        run: |
          # Логи job'а из песочницы не читаются (result-хост не в списке разрешённых),
          # поэтому вывод шага пишется в файл, а при падении его последние строки
          # публикуются аннотацией: аннотации отдаёт Checks API, они доступны всегда.
          diag="$RUNNER_TEMP/hf-diag.log"; : > "$diag"
          trap 'sync; sleep 6; tail -c 4000 "$diag" | sed -e "s/[[:cntrl:]]/ /g" -e "s/%/%25/g" -e "s|^|::error::[grid-test ${{ matrix.corpus }} шард ${{ matrix.shard }}] |"; tail -n 60 "$diag" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          exec > >(tee -a "$diag") 2>&1
          corpus="${{ matrix.corpus }}"
          case "$corpus" in
            a3) dir="data/corpus_a3/splits" ;;
            a1) dir="data/corpus_a/splits" ;;
            *) echo "неизвестный корпус $corpus" >&2; exit 2 ;;
          esac
          python scripts/precompute_features.py \
            --grid \
            --model "$HF_MODEL" \
            --dataset "$dir/test.jsonl" \
            --split-files "${corpus}-test=$dir/test.jsonl" \
            --out reports/hf-grid-test \
            --shard "${{ matrix.shard }}" \
            --shards "4"
      - uses: actions/upload-artifact@v4
        with:
          name: "grid-test-${{ matrix.corpus }}-${{ matrix.shard }}"
          path: spanverify-module/reports/hf-grid-test/
          retention-days: 30
          if-no-files-found: error

  final:
    name: "Шаг 3: финальная оценка на test (один раз)"
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_final) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[hf-final]')) }}
    needs: [sweep, grid-test]
    runs-on: ubuntu-latest
    # 90 минут. Прогон `38053135407` был убит лимитом 40 минут ровно на шаге
    # «Финальный прогон»: там на каждый seed уходило по шесть обучений — пять
    # фолдов CV ради порога, который уже зафиксирован до запуска, и одно итоговое.
    # Теперь при замороженном пороге CV не запускается вовсе (scripts/hf_protocol.py),
    # а запас оставлен потому, что единственный запуск не должен зависеть от
    # оценки времени.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Собрать кеш train+dev и test"
        uses: actions/download-artifact@v4
        with:
          pattern: "grid*"
          path: spanverify-module/reports/hf-grid
          merge-multiple: true
      - name: "Взять сводку шага 2 (для сверки источника выбора конфигурации)"
        # Артефакт собран из reports/hf_protocol/ и reports/hf_baseline/, то есть
        # его корень — spanverify-module: распаковываем в него, иначе тесты
        # шага 3 не увидят reports/hf_protocol/sweep.json (откуда конфигурация)
        # и останутся без manifest_val.json.
        uses: actions/download-artifact@v4
        with:
          name: "hf-protocol-sweep"
          path: spanverify-module
      - name: "Зависимости и среда"
        uses: ./.github/actions/hf-setup
      - name: "Проверка, что конфигурация зафиксирована"
        working-directory: spanverify-module
        run: |
          if [ ! -f config/hf_final_config.json ]; then
            echo "нет config/hf_final_config.json: шаг 3 выполняется только после того, как" >&2
            echo "выбранная на val конфигурация зафиксирована коммитом (docs/EXPERIMENTS.md, шаг 3)" >&2
            exit 1
          fi
          python - << 'PY'
          import json
          config = json.load(open("config/hf_final_config.json", encoding="utf-8"))
          assert config.get("step") == "final-config", config.get("step")
          print("зафиксировано:", config.get("name"), "| признаков:", len(config.get("features", [])))
          PY
      - name: "Финальный прогон"
        working-directory: spanverify-module
        run: |
          # Логи job'а из песочницы не читаются (result-хост не в списке разрешённых),
          # поэтому вывод шага пишется в файл, а при падении его последние строки
          # публикуются аннотацией: аннотации отдаёт Checks API, они доступны всегда.
          diag="$RUNNER_TEMP/hf-diag.log"; : > "$diag"
          trap 'sync; sleep 6; tail -c 4000 "$diag" | sed -e "s/[[:cntrl:]]/ /g" -e "s/%/%25/g" -e "s|^|::error::[final] |"; tail -n 60 "$diag" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          exec > >(tee -a "$diag") 2>&1
          set -x
          python scripts/hf_protocol.py final \
            --config config/hf_final_config.json \
            --grid-cache reports/hf-grid \
            --splits data/corpus_a3/splits \
            --corpus-name a3 \
            --seeds 42,43,44,45,46 \
            --include-val \
            --freeze reports/hf_protocol/freeze.json \
            --out reports/hf_final
      - name: "Пересчёт чисел из предсказаний"
        working-directory: spanverify-module
        run: |
          python scripts/hf_protocol.py verify-manifest \
            --manifest reports/hf_final/manifest.json \
            --predictions reports/hf_final/predictions_test.jsonl.gz \
            --check-splits
      - uses: actions/upload-artifact@v4
        # always() и warn: числа нужны, даже если следующий шаг упадёт или job
        # догонит таймаут. Иначе единственный финальный прогон придётся повторять
        # вслепую, не зная, успел ли он записать манифест.
        if: ${{ always() }}
        with:
          name: "hf-protocol-final"
          path: spanverify-module/reports/hf_final/
          retention-days: 90
          if-no-files-found: warn
      - name: "Опубликовать в ветку данных"
        if: ${{ always() }}
        # Манифест, предсказания и gold — в ветку данных: только так их может
        # перепроверить тот, у кого нет доступа к артефактам. Сюда же кладутся
        # сгенерированный блок README и журнал: их числа обязаны совпасть с
        # манифестом буквально, байт в байт.
        working-directory: spanverify-module
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f reports/hf_final/manifest.json ]; then
            echo "::warning::[publish] reports/hf_final/manifest.json не создан — публиковать нечего"
            exit 0
          fi
          python scripts/publish_reports.py --branch data/metrics --dest hf-final \
            --report reports/hf_final --report ../README.md --report docs/EXPERIMENTS.md \
            --message "hf протокол: шаг 3, критерий на test, прогон ${{ github.run_number }} [skip ci]"
      - name: "Блок критерия в README — из манифеста, не от руки"
        # До измерения в README стоит отметка «не измерено»: переписывать числа
        # от руки запрещено, поэтому блок генерируется из только что полученного
        # манифеста и тут же сверяется генератором и check_numbers. В ветку блок
        # попадает следующим коммитом — вместе с артефактами прогона.
        working-directory: spanverify-module
        run: |
          python scripts/render_hf_table.py --readme ../README.md --write
          python scripts/render_hf_table.py --readme ../README.md
          python scripts/check_numbers.py --metrics reports/METRICS.json
      - name: "Подтверждающие тесты (падение = критерий не выполнен)"
        working-directory: spanverify-module
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_reported_metrics.py tests/test_no_test_leakage.py tests/test_metric_spec.py tests/test_criterion_hf.py

  final-a1:
    name: "Шаг 3 (вторично): тот же замороженный конфиг на A1"
    # Отдельный job, а не шаг внутри `final`: вторичное измерение не может ни
    # съесть лимит времени основного прогона, ни утопить его публикацию. Условие
    # то же, что у `final` — запускается только коммитом с меткой [hf-final].
    # Объявлено ДО запуска (отступления в docs/EXPERIMENTS.md): это то же
    # измерение на втором корпусе, а не переподбор параметров; статусом критерия
    # не является и изменить его не может.
    # `!cancelled()`: у `final` по протоколу может быть красный шаг подтверждающих
    # тестов (невыполненный критерий показывается падением, а не skip), и это не
    # повод отменять вторичное измерение A1 — оно объявлено до запуска.
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.run_final) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[hf-final]'))) }}
    needs: final
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Собрать кеш train+dev и test"
        uses: actions/download-artifact@v4
        with:
          pattern: "grid*"
          path: spanverify-module/reports/hf-grid
          merge-multiple: true
      - name: "Зависимости продукта"
        # torch здесь не нужен: шаг читает признаки из кеша, а не грузит модель,
        # поэтому ставим только requirements.txt — иначе вторичный прогон ждал бы
        # установку весов ради предсказуемого отказа.
        working-directory: spanverify-module
        run: python -m pip install -q -r requirements.txt
      - name: "Вторичное измерение: A1"
        working-directory: spanverify-module
        run: |
          set +e
          python scripts/hf_protocol.py final \
            --config config/hf_final_config.json \
            --grid-cache reports/hf-grid \
            --splits data/corpus_a/splits \
            --corpus-name a1 \
            --seeds 42,43,44,45,46 \
            --include-val \
            --freeze reports/hf_protocol/freeze.json \
            --out reports/hf_final_a1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::[secondary a1] вторичное измерение не выполнено (код $code); статус критерия не затронут"
            exit 0
          fi
          python scripts/hf_protocol.py verify-manifest \
            --manifest reports/hf_final_a1/manifest.json \
            --predictions reports/hf_final_a1/predictions_test.jsonl.gz \
            --check-splits || echo "::warning::[secondary a1] пересчёт манифеста не сошёлся"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: "hf-protocol-final-a1"
          path: spanverify-module/reports/hf_final_a1/
          retention-days: 90
          if-no-files-found: warn
      - name: "Опубликовать в ветку данных"
        if: ${{ always() }}
        working-directory: spanverify-module
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f reports/hf_final_a1/manifest.json ]; then
            echo "::warning::[publish] вторичный манифест не создан — публиковать нечего"
            exit 0
          fi
          python scripts/publish_reports.py --branch data/metrics --dest hf-final-a1 \
            --report reports/hf_final_a1 \
            --message "hf протокол: шаг 3, вторичное измерение A1, прогон ${{ github.run_number }} [skip ci]"
