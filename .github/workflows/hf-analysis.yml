# Разбор ложных пометок на чистых парах официального теста по готовому кешу.
#
# Модель не запускается: читаются артефакты тяжёлого прогона (кеш признаков) и
# обученный бандл из ветки. Ничего не подбирается — бандл применяется как есть,
# результат возвращается таблицей в data/metrics коммитом [skip ci] и артефактом.
#
# Запуск: workflow_dispatch (номер прогона с кешем — параметр) или пуш
# .github/hf-analysis.trigger в ветку arena/**.
name: Разбор ложных пометок по кешу

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Прогон Тяжёлых прогонов hf, из которого брать кеш A3"
        default: "37609202780"
  push:
    branches: ["arena/**"]
    paths:
      - .github/hf-analysis.trigger

concurrency:
  group: hf-analysis-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUN_ID: ${{ github.event.inputs.run_id || '37609202780' }}

jobs:
  clean-false-flags:
    name: "Чистые пары теста: разбор по кешу"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Зависимости (без torch: работают только кеш и стандартная библиотека)"
        working-directory: spanverify-module
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt
      - name: "Кеш признаков из прогона"
        uses: actions/download-artifact@v4
        with:
          name: hf-runs-a3
          run-id: ${{ env.RUN_ID }}
          path: /tmp/hf-analysis-dl
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Разложить кеш"
        run: |
          python3 - << 'PY'
          import shutil
          from pathlib import Path
          src = next((p for p in Path("/tmp/hf-analysis-dl").rglob("*") if p.is_dir() and p.name == "hf-cache-a3"), None)
          if src is None:
              raise SystemExit("в артефакте нет каталога hf-cache-a3")
          dest = Path("spanverify-module/reports/hf-cache-a3")
          dest.mkdir(parents=True, exist_ok=True)
          count = 0
          for path in src.rglob("*"):
              if path.is_file():
                  target = dest / path.relative_to(src)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
                  count += 1
          print("файлов кеша:", count)
          PY
      - name: "Разбор чистых пар теста по кешу (без запуска модели)"
        working-directory: spanverify-module
        timeout-minutes: 20
        run: |
          echo "команда: python scripts/analyze_clean_false_flags.py --dataset data/corpus_a3/pairs.jsonl --splits data/corpus_a3/splits --bundle reports/experiments/a3/weights.json --mode hf --model ai-forever/rugpt3small_based_on_gpt2 --features-cache reports/hf-cache-a3 --run-id $RUN_ID --out-md data/metrics/clean_false_flags_a3.md --out-json data/metrics/clean_false_flags_a3.json"
          python scripts/analyze_clean_false_flags.py \
            --dataset data/corpus_a3/pairs.jsonl \
            --splits data/corpus_a3/splits \
            --bundle reports/experiments/a3/weights.json \
            --mode hf --model ai-forever/rugpt3small_based_on_gpt2 \
            --features-cache reports/hf-cache-a3 \
            --run-id "$RUN_ID" \
            --out-md data/metrics/clean_false_flags_a3.md \
            --out-json data/metrics/clean_false_flags_a3.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-false-flags
          path: |
            spanverify-module/data/metrics/clean_false_flags_a3.md
            spanverify-module/data/metrics/clean_false_flags_a3.json
          if-no-files-found: warn
          retention-days: 30
      - name: "Коммит таблицы в data/metrics"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- spanverify-module/data/metrics/clean_false_flags_a3.md spanverify-module/data/metrics/clean_false_flags_a3.json
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "числа: разбор ложных пометок по кешу прогона $RUN_ID [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "запушено ${GITHUB_REF_NAME}"
