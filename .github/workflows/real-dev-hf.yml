name: real-dev HF (Phase C true)

on:
  push:
    branches: ["science/corpus-real-c"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  hf-real-dev:
    name: HF p8-sealed + p8+H1 on real_dev 300
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanverify-module/requirements-hf.txt

      - name: Зависимости HF
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r spanverify-module/requirements.txt -r spanverify-module/requirements-hf.txt

      - name: Проверить замороженный бандл
        run: |
          sha=$(sha256sum spanverify-module/reports/experiments/p5_span_filter/run39170981235/combined_bundle.json | cut -d' ' -f1)
          echo "bundle sha $sha"
          test "$sha" = "e0b13c693a058dfd66ed24a52fc14e9c70964e95885358e7b99cc1f328ad6892" || { echo "::error::bundle drift"; exit 1; }

      - name: HF p8-sealed — real_dev 300
        run: |
          PYTHONPATH=spanverify-module python -m spanverify evaluate --dataset reports/science/real/real_dev_pairs.jsonl --json > /tmp/real_dev_hf_sealed.json
          cat /tmp/real_dev_hf_sealed.json
          python -c "import json,hashlib,pathlib; ds=hashlib.sha256(pathlib.Path('reports/science/real/real_dev_pairs.jsonl').read_bytes()).hexdigest(); j=json.load(open('/tmp/real_dev_hf_sealed.json')); assert j['pairs']==300; print('dataset_sha',ds); open('/tmp/real_dev_hf_sealed_receipt.json','w').write(json.dumps({'dataset_sha256':ds,'run_id':'real-dev-hf-sealed','bundle_sha':'e0b13c69','mode':'hf'},indent=2))"

      - name: HF p8+H1 — real_dev 300 (изотонная доля)
        run: |
          # Фикс окружения (а) — file-based path, а не export "$(cat json)" (shell рвёт JSON с переносами/кавычками, Path(...).read_text ожидает путь)
          export SPANVERIFY_AI_SHARE_CALIBRATOR=reports/p7/final-receipts/ai_share_calibrator_v1.hf.json
          PYTHONPATH=spanverify-module python -m spanverify evaluate --dataset reports/science/real/real_dev_pairs.jsonl --json > /tmp/real_dev_hf_h1.json
          cat /tmp/real_dev_hf_h1.json
          echo "H1 HF done"

      - name: Если HF не завёлся — аварийное тех. препятствие
        if: failure()
        run: |
          echo "::error::HF раннер не работает с весами — аварийное тех. препятствие, стоп без подмены demo"
          exit 1

      - name: Артефакты HF Phase C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-dev-hf-phaseC
          path: |
            /tmp/real_dev_hf_sealed.json
            /tmp/real_dev_hf_h1.json
            /tmp/real_dev_hf_sealed_receipt.json
          retention-days: 30
