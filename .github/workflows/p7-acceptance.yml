name: P7 frozen engineering gates
on:
  workflow_dispatch:
  push:
    branches: [arena/c5f69767-smarty-chumakov]
    paths: [.github/p7-acceptance.trigger]
permissions:
  contents: read
  actions: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r spanverify-module/requirements-token-head-tests.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: hf-cache-a3-v2-*
          merge-multiple: false
          path: .arena/hf-reference
          run-id: 39060670054
          github-token: ${{ github.token }}
      - name: Actual frozen public dev replay; zero drift required, no fitting
        working-directory: spanverify-module
        run: python scripts/p6_acceptance.py parity --cache ../.arena/hf-reference --out ../reports/acceptance/parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-parity
          path: reports/acceptance/parity/
      - name: Byte-exact pre-change golden I/O
        run: python spanverify-module/scripts/p7_golden.py check reports/p7/pre-change-golden-stable.json
  hf-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed product HF dependencies
        run: |
          pip install 'torch~=2.14' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers~=5.18' 'sentencepiece~=0.2'
      - name: Actual HF golden, train/dev tokenizer audit and long-answer coverage
        run: python spanverify-module/scripts/p7_hf_audit.py reports/p7/hf-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-hf-contract
          path: reports/p7/hf-contract/
          retention-days: 90
