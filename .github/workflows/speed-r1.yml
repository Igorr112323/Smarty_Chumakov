name: speed-r1 phase B

# Только на ветке speed/r1 — исключение из правила «только добавления» для этого файла
on:
  push:
    branches: [speed/r1]
  workflow_dispatch:

concurrency:
  group: speed-r1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: Quality + suite green
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COVERAGE_CORE: sysmon
    defaults:
      run:
        working-directory: spanverify-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spanverify-module/requirements.txt
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-token-head-tests.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Black
        run: python -m black --check .
      - name: Pytest coverage 85%
        run: |
          python -m pytest --cov=spanverify --cov-report=term --cov-report=json:reports/coverage.json --junitxml=reports/quality-junit.xml -v --tb=short 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          echo "pytest exit $status"
          cat reports/quality-junit.xml 2>&1 | head -n 200
          # show failures
          python -m pytest --collect-only -q 2>&1 | tail -n 20
          exit $status
      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ github.run_id }}
          path: |
            /tmp/pytest.log
            spanverify-module/reports/quality-junit.xml
            spanverify-module/reports/coverage.json
          retention-days: 7

      - name: Reproducibility train
        run: |
          python -m spanverify train --dataset data/demo_pairs.jsonl --out /tmp/run1/train/weights.json --seed 42 --folds 5 > /tmp/train1.log
          python -m spanverify train --dataset data/demo_pairs.jsonl --out /tmp/run2/train/weights.json --seed 42 --folds 5 > /tmp/train2.log
          sha256sum /tmp/run1/train/weights.json /tmp/run2/train/weights.json /tmp/run1/config/head.json /tmp/run2/config/head.json /tmp/run1/config/participation.json /tmp/run2/config/participation.json
          for n in train/weights.json config/head.json config/participation.json; do test "$(sha256sum < /tmp/run1/$n | cut -d' ' -f1)" = "$(sha256sum < /tmp/run2/$n | cut -d' ' -f1)" || exit 1; done

  identity:
    name: Identity gate dev181 + B
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanverify-module/requirements.txt
      - name: Install demo deps + torch
        run: |
          python -m pip install --upgrade pip
          pip install -q -r spanverify-module/requirements.txt -r spanverify-module/requirements-token-head-tests.txt
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r spanverify-module/requirements-hf.txt
      - name: Identity gate (dev181 + B)
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python tools/speed_r1_identity.py --out reports/speed/r1/IDENTITY_RECEIPT.json
          cat reports/speed/r1/IDENTITY_RECEIPT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-receipt
          path: reports/speed/r1/IDENTITY_RECEIPT.json
          retention-days: 30
      # Process exception autocommits disabled: workflow is now read-only (see report Process Exception section)
      # - name: Commit identity receipt (HF) to speed/r1
      #   if: success()
      #   run: |
      #     git config user.name "speed-r1-bot"
      #     git config user.email "speed-r1-bot@users.noreply.github.com"
      #     git add reports/speed/r1/IDENTITY_RECEIPT.json
      #     if git diff --cached --quiet; then echo "no changes"; exit 0; fi
      #     git commit -m "SPEED-R1 identity: HF dev181+B from CI ${{ github.run_id }} on $(git rev-parse HEAD)"
      #     git push origin HEAD:speed/r1

  bench:
    name: HF benchmarks phase B (resident warm + cold, 2c vs allcores)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: identity
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        thermal: [cold-process, warm-model]
        config: [2cores, allcores]
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spanverify-module/requirements.txt
      - name: Install deps + torch
        run: |
          python -m pip install --upgrade pip
          pip install -q -r spanverify-module/requirements.txt -r spanverify-module/requirements-token-head-tests.txt
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r spanverify-module/requirements-hf.txt
      - name: Bench HF ${{ matrix.thermal }} ${{ matrix.config }}
        run: |
          if [ "${{ matrix.config }}" = "2cores" ]; then
            taskset -c 0,1 python tools/speed_r1_phase_b_measure.py --mode hf --thermal ${{ matrix.thermal }} --workers 2 --batch 4 --out reports/speed/r1/bench_hf_${{ matrix.thermal }}_${{ matrix.config }}.json --repeats 10
          else
            python tools/speed_r1_phase_b_measure.py --mode hf --thermal ${{ matrix.thermal }} --workers 4 --batch 8 --out reports/speed/r1/bench_hf_${{ matrix.thermal }}_${{ matrix.config }}.json --repeats 10
          fi
          cat reports/speed/r1/bench_hf_${{ matrix.thermal }}_${{ matrix.config }}.json
      - name: Bench demo ${{ matrix.thermal }} ${{ matrix.config }}
        run: |
          if [ "${{ matrix.config }}" = "2cores" ]; then
            taskset -c 0,1 python tools/speed_r1_phase_b_measure.py --mode demo --thermal ${{ matrix.thermal }} --workers 2 --batch 4 --out reports/speed/r1/bench_demo_${{ matrix.thermal }}_${{ matrix.config }}.json --repeats 10
          else
            python tools/speed_r1_phase_b_measure.py --mode demo --thermal ${{ matrix.thermal }} --workers 4 --batch 8 --out reports/speed/r1/bench_demo_${{ matrix.thermal }}_${{ matrix.config }}.json --repeats 10
          fi
          cat reports/speed/r1/bench_demo_${{ matrix.thermal }}_${{ matrix.config }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.thermal }}-${{ matrix.config }}
          path: reports/speed/r1/bench_*.json
          retention-days: 30
      # Process exception autocommits disabled: workflow is now read-only
      # - name: Commit bench results to speed/r1
      #   if: success()
      #   run: |
      #     git config user.name "speed-r1-bot"
      #     git config user.email "speed-r1-bot@users.noreply.github.com"
      #     git add reports/speed/r1/bench_*.json
      #     if git diff --cached --quiet; then echo "no changes"; exit 0; fi
      #     git commit -m "SPEED-R1 bench: HF+demo ${{ matrix.thermal }} ${{ matrix.config }} from CI ${{ github.run_id }} on $(git rev-parse HEAD)"
      #     for i in 1 2 3 4 5; do git pull --rebase origin speed/r1 && git push origin HEAD:speed/r1 && break || sleep 5; done

  storage:
    name: Storage audit ≤1.5GB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Storage audit
        run: |
          python tools/speed_r1_storage.py --out reports/speed/r1/storage_audit.json
          cat reports/speed/r1/storage_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-audit
          path: reports/speed/r1/storage_audit.json
          retention-days: 30
