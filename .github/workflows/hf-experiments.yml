# Реальные метрики режима hf на корпусах A3 и A.
#
# Шаг 2б: полный прогон с чанкингом. Сухой прогон (dry-run-cost) на голове
# 7218317e дал честное число: 6,4 с/пара, 150 пар = 16:57, 1200 пар ≈ 2 часа.
# Отсюда: A3 — 8 шардов по 150 пар (~16–17 мин), A — 6 шардов по 200 пар
# (~19 мин). Лимит шага precompute 25 мин, лимит job 35 мин — оба проходим.
#
# Все precompute пишут чанкованные ключи (chunking=True, max_length=512)
# в reports/hf-cache-v2. Эксперимент читает из того же каталога и тем же
# ключом (engine._features ищет chunking=True). Без --chunked в precompute
# ключи не совпадают с engine, и experiment уходит в таймаут — это уже
# случилось в прогоне 38970621969 (оба эксперимента по 30 минут и обрыв).
#
# Запуск — правкой .github/hf-experiments.trigger либо вручную (workflow_dispatch).
# Результаты — в артефакты и в ветку данных data/metrics, всегда с [skip ci].
name: Эксперименты hf (корпуса A3 и A)

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - .github/hf-experiments.trigger

concurrency:
  group: hf-experiments-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ─── A3: 8 шардов по 150 пар, чанкинг, ~16–17 мин каждый ──────────────
  precompute-a3:
    name: "Признаки A3 (шард ${{ matrix.shard }}/8, чанкинг)"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Кеш модели HuggingFace (~1.1 ГБ)"
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-rugpt3small-${{ runner.os }}
          restore-keys: |
            hf-model-rugpt3small-

      - name: "Зависимости и CPU-версия torch"
        working-directory: spanverify-module
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q "torch~=2.14" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r requirements-hf.txt

      - name: "Предпосчёт признаков шарда (чанкинг, ~150 пар)"
        working-directory: spanverify-module
        timeout-minutes: 25
        env:
          OMP_NUM_THREADS: "4"
          HF_HOME: "/home/runner/.cache/huggingface"
        run: |
          time python scripts/precompute_features.py \
            --dataset data/corpus_a3/pairs.jsonl \
            --mode hf --chunked \
            --shard ${{ matrix.shard }} --shards 8 \
            --out reports/hf-cache-v2

      - uses: actions/upload-artifact@v4
        with:
          name: hf-cache-a3-v2-${{ matrix.shard }}
          path: |
            spanverify-module/reports/hf-cache-v2/precompute_shard${{ matrix.shard }}of8-chunked.json
            spanverify-module/reports/hf-cache-v2/features_shard${{ matrix.shard }}of8-chunked.jsonl
          if-no-files-found: error
          retention-days: 14

  # ─── A: 6 шардов по 200 пар, чанкинг, ~19 мин каждый ──────────────────
  precompute-a:
    name: "Признаки A (шард ${{ matrix.shard }}/6, чанкинг)"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Кеш модели HuggingFace (~1.1 ГБ)"
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-rugpt3small-${{ runner.os }}
          restore-keys: |
            hf-model-rugpt3small-

      - name: "Зависимости и CPU-версия torch"
        working-directory: spanverify-module
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q "torch~=2.14" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r requirements-hf.txt

      - name: "Предпосчёт признаков шарда (чанкинг, ~200 пар)"
        working-directory: spanverify-module
        timeout-minutes: 25
        env:
          OMP_NUM_THREADS: "4"
          HF_HOME: "/home/runner/.cache/huggingface"
        run: |
          time python scripts/precompute_features.py \
            --dataset data/corpus_a/pairs.jsonl \
            --mode hf --chunked \
            --shard ${{ matrix.shard }} --shards 6 \
            --out reports/hf-cache-v2

      - uses: actions/upload-artifact@v4
        with:
          name: hf-cache-a-v2-${{ matrix.shard }}
          path: |
            spanverify-module/reports/hf-cache-v2/precompute_shard${{ matrix.shard }}of6-chunked.json
            spanverify-module/reports/hf-cache-v2/features_shard${{ matrix.shard }}of6-chunked.jsonl
          if-no-files-found: error
          retention-days: 14

  # ─── Эксперимент A3: читает чанкованный кеш, без пересчёта ────────────
  experiment-a3:
    name: "Эксперимент A3 (реальные акты, чанкованный кеш)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: precompute-a3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Зависимости и CPU-версия torch"
        working-directory: spanverify-module
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q "torch~=2.14" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r requirements-hf.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: hf-cache-a3-v2-*
          path: spanverify-module/reports/hf-cache-v2
          merge-multiple: true

      - name: "Кеш признаков A3: сколько собралось"
        working-directory: spanverify-module
        run: |
          ls -la reports/hf-cache-v2/
          echo "--- summary per shard ---"
          cat reports/hf-cache-v2/precompute_*-chunked.json
          echo "--- total lines ---"
          wc -l reports/hf-cache-v2/features_*-chunked.jsonl | tail -1

      - name: "Эксперимент: кросс-валидация на кеше"
        working-directory: spanverify-module
        timeout-minutes: 30
        env:
          OMP_NUM_THREADS: "4"
        run: |
          python scripts/run_experiments.py \
            --dataset data/corpus_a3/pairs.jsonl \
            --mode hf --seed 42 --folds 5 --target-fpr 0.1 \
            --features-cache reports/hf-cache-v2 \
            --out reports/experiments-a3 2>&1 | tee reports/experiments-a3.log

      - name: "Счётчик кеша: попаданий / промахов"
        working-directory: spanverify-module
        run: |
          grep -E "кеш признаков: попаданий|промахов" reports/experiments-a3.log || true
          # Если промахов > 0, это признак рассинхронизации ключей.
          # Без --require-cache это не фатально, но предупреждение важно.

      - uses: actions/upload-artifact@v4
        with:
          name: hf-experiment-a3
          path: |
            spanverify-module/reports/experiments-a3
            spanverify-module/reports/experiments-a3.log
          if-no-files-found: warn
          retention-days: 30

  # ─── Эксперимент A: читает чанкованный кеш, без пересчёта ─────────────
  experiment-a:
    name: "Эксперимент A (синтетика, чанкованный кеш)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: precompute-a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Зависимости и CPU-версия torch"
        working-directory: spanverify-module
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q "torch~=2.14" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r requirements-hf.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: hf-cache-a-v2-*
          path: spanverify-module/reports/hf-cache-v2
          merge-multiple: true

      - name: "Кеш признаков A: сколько собралось"
        working-directory: spanverify-module
        run: |
          ls -la reports/hf-cache-v2/
          echo "--- summary per shard ---"
          cat reports/hf-cache-v2/precompute_*-chunked.json
          echo "--- total lines ---"
          wc -l reports/hf-cache-v2/features_*-chunked.jsonl | tail -1

      - name: "Эксперимент: кросс-валидация на кеше"
        working-directory: spanverify-module
        timeout-minutes: 30
        env:
          OMP_NUM_THREADS: "4"
        run: |
          python scripts/run_experiments.py \
            --dataset data/corpus_a/pairs.jsonl \
            --mode hf --seed 42 --folds 5 --target-fpr 0.1 \
            --features-cache reports/hf-cache-v2 \
            --out reports/experiments-a 2>&1 | tee reports/experiments-a.log

      - name: "Счётчик кеша: попаданий / промахов"
        working-directory: spanverify-module
        run: |
          grep -E "кеш признаков: попаданий|промахов" reports/experiments-a.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: hf-experiment-a
          path: |
            spanverify-module/reports/experiments-a
            spanverify-module/reports/experiments-a.log
          if-no-files-found: warn
          retention-days: 30

  # ─── Сведение результатов ─────────────────────────────────────────────
  publish:
    name: "Свести числа и сохранить"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [experiment-a3, experiment-a]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: hf-experiment-a3
          path: spanverify-module/reports/experiments-a3

      - uses: actions/download-artifact@v4
        with:
          name: hf-experiment-a
          path: spanverify-module/reports/experiments-a

      - name: "Зависимости"
        working-directory: spanverify-module
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements.txt

      - name: "Свести числа"
        working-directory: spanverify-module
        timeout-minutes: 10
        run: |
          python scripts/collect_metrics.py --out reports/METRICS.json
          python scripts/cross_corpus.py --out reports/cross_corpus.json || true
          python - <<'PY'
          import json, pathlib
          metrics = json.loads(pathlib.Path("reports/METRICS.json").read_text(encoding="utf-8"))
          print("прогонов hf:", metrics.get("external_tests", {}).get("hf_runs"))
          for key in ("corpus_a", "corpus_a3_real"):
              modes = metrics.get(key, {}).get("by_mode", {})
              for mode in ("demo", "hf"):
                  test = modes.get(mode, {}).get("by_split", {}).get("test")
                  if test:
                      tokens = test.get("tokens", {})
                      print(f"{key} {mode} test: F1={tokens.get('f1')} FPR={tokens.get('fpr')} AUC={tokens.get('auc')}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hf-metrics-summary
          path: |
            spanverify-module/reports/METRICS.json
            spanverify-module/reports/cross_corpus.json
          if-no-files-found: warn
          retention-days: 30

      - name: "Сохранить в ветку данных"
        working-directory: spanverify-module
        run: |
          mkdir -p /tmp/keepexp && rm -rf /tmp/keepexp/*
          cp -r reports /tmp/keepexp/reports 2>/dev/null || true
          cd ..
          git config user.name "spanverify-bot"
          git config user.email "bot@spanverify.local"
          git fetch origin data/metrics || true
          git checkout -B data/metrics origin/data/metrics
          mkdir -p experiments
          cp -r /tmp/keepexp/reports/experiments-a3 experiments/ 2>/dev/null || true
          cp -r /tmp/keepexp/reports/experiments-a experiments/ 2>/dev/null || true
          cp /tmp/keepexp/reports/METRICS.json experiments/METRICS-hf-${{ github.run_number }}.json 2>/dev/null || true
          git add -A experiments
          git diff --cached --quiet && echo "изменений нет" && exit 0
          git commit -m "hf: эксперименты с кешем признаков (чанкинг), прогон ${{ github.run_number }} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:data/metrics; then
              echo "ветка данных обновлена с попытки $attempt"
              break
            fi
            echo "пуш отклонён, попытка $attempt"
            git fetch origin data/metrics
            git rebase FETCH_HEAD || git rebase --abort
            sleep $((attempt * 10))
          done
