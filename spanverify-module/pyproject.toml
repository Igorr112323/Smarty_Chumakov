# Настройки качества кода SpanVerify: тесты, покрытие, линтер, форматирование.
# Здесь только инструменты; сам продукт работает без сторонних зависимостей.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = false
source = ["spanverify"]

[tool.coverage.report]
show_missing = true
# Минимум покрытия проверяется в CI (--cov-fail-under=85).
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["build", "dist", "release", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Историческая ветка (текстовый детектор) сохранена как есть: она проверена
# своими тестами, но новых требований к стилю к ней не предъявляем.
"spanverify/detector.py" = ["E501"]
"spanverify/demo_data.py" = ["E501"]
"spanverify/training.py" = ["E501"]
"spanverify/backends/hf.py" = ["E501"]
