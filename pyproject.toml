[tool.ruff]
exclude = ["reports", "build", "dist", ".venv", "spanverify-module/reports", "tools", "scripts"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "reports|tools|scripts"
